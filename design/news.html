<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>World news, 20 November 2026</title>
<style>
  html, body { margin: 0; padding: 0; background: #15123a; }
  svg { display: block; }
  .kicker { font: 700 26px 'Liberation Sans', 'DejaVu Sans', sans-serif; letter-spacing: 4px; fill: #ffcb47; }
  .date   { font: 700 70px 'Liberation Sans Narrow', 'Liberation Sans', sans-serif; fill: #fff; }
  .tag    { font: 700 20px 'Liberation Sans', sans-serif; letter-spacing: 2px; fill: #fff; }
  .head   { font: 700 42px 'Liberation Sans Narrow', 'Liberation Sans', sans-serif; fill: #fff; }
  .lead   { font: 700 52px 'Liberation Sans Narrow', 'Liberation Sans', sans-serif; fill: #fff; }
  .sub    { font: 400 24px 'Liberation Sans Narrow', 'Liberation Sans', sans-serif; fill: #e4e1ff; }
  .leadsub{ font: 400 27px 'Liberation Sans Narrow', 'Liberation Sans', sans-serif; fill: #e4e1ff; }
  .foot   { font: 400 17px 'Liberation Sans', sans-serif; fill: #a9a4d8; }
  .label  { font: 700 20px 'Liberation Sans', sans-serif; letter-spacing: 2px; fill: #fff; opacity: .85; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1850"/><stop offset="1" stop-color="#110e2e"/>
    </linearGradient>
    <!-- fire glow: bright core fading to nothing, drawn with gradients only -->
    <radialGradient id="blast">
      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset=".25" stop-color="#ffd166" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#ff7a2f" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ff4d2e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="softglow">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trail" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity=".95"/>
    </linearGradient>
    <linearGradient id="nightsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16123f"/><stop offset=".7" stop-color="#3b2a72"/><stop offset="1" stop-color="#6a3f86"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d4f96"/><stop offset="1" stop-color="#162a5a"/>
    </linearGradient>
    <linearGradient id="scrimL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#120f33" stop-opacity=".92"/>
      <stop offset=".55" stop-color="#120f33" stop-opacity=".75"/>
      <stop offset="1" stop-color="#120f33" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scrimR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#120f33" stop-opacity=".96"/>
      <stop offset=".7" stop-color="#120f33" stop-opacity=".85"/>
      <stop offset="1" stop-color="#120f33" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="caption" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#120f33" stop-opacity="0"/>
      <stop offset=".35" stop-color="#120f33" stop-opacity=".9"/>
      <stop offset="1" stop-color="#120f33" stop-opacity=".97"/>
    </linearGradient>
    <linearGradient id="marketsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f2a4a"/><stop offset="1" stop-color="#1b1a4d"/>
    </linearGradient>
    <linearGradient id="space" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0d2b"/><stop offset="1" stop-color="#1a2a6a"/>
    </linearGradient>
    <radialGradient id="planet" cx=".7" cy=".1" r="1">
      <stop offset="0" stop-color="#3f8fd6"/><stop offset="1" stop-color="#173f87"/>
    </radialGradient>
    <radialGradient id="ocean" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#4fb4f0"/><stop offset="1" stop-color="#1d5bb0"/>
    </radialGradient>
    <linearGradient id="climatesky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#103a3a"/><stop offset="1" stop-color="#1b2550"/>
    </linearGradient>
    <linearGradient id="desertsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1440"/><stop offset=".65" stop-color="#5a2c6e"/><stop offset="1" stop-color="#c0584f"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5c6fb8"/><stop offset=".5" stop-color="#8ea6e8"/><stop offset=".5" stop-color="#3c4a8c"/><stop offset="1" stop-color="#2b3570"/>
    </linearGradient>
    <clipPath id="clipLead"><rect width="944" height="292" rx="18"/></clipPath>
    <clipPath id="clipTile"><rect width="463" height="254" rx="18"/></clipPath>
  </defs>

  <rect width="1024" height="1024" fill="url(#page)"/>
  <g fill="#fff" opacity=".35">
    <circle cx="880" cy="40" r="1.6"/><circle cx="940" cy="90" r="1.2"/><circle cx="760" cy="30" r="1"/><circle cx="990" cy="20" r="1.4"/><circle cx="700" cy="70" r="1"/>
  </g>

  <!-- Header -->
  <text x="40" y="56" class="kicker">THE DAY'S WORLD NEWS</text>
  <text x="40" y="128" class="date">FRIDAY 20 NOVEMBER 2026</text>
  <rect x="40" y="146" width="944" height="4" rx="2" fill="#ffcb47"/>

  <!-- Lead: Kyiv bridges at night -->
  <g class="tile" transform="translate(40,166)">
    <rect class="frame" width="944" height="292" rx="18" fill="#1a1646"/>
    <g clip-path="url(#clipLead)">
      <rect width="944" height="292" fill="url(#nightsky)"/>
      <g fill="#fff">
        <circle cx="40" cy="30" r="1.8" opacity=".8"/><circle cx="130" cy="60" r="1.2" opacity=".6"/><circle cx="210" cy="22" r="1.5" opacity=".7"/>
        <circle cx="300" cy="48" r="1" opacity=".6"/><circle cx="380" cy="18" r="1.6" opacity=".8"/><circle cx="460" cy="70" r="1.1" opacity=".5"/>
        <circle cx="90" cy="95" r="1" opacity=".5"/><circle cx="250" cy="100" r="1.2" opacity=".5"/>
      </g>
      <!-- far skyline -->
      <path d="M0 160 h40 v-30 h30 v20 h25 v-46 h18 v46 h30 v-22 h40 v-14 l12 -18 l12 18 v36 h36 v-40 h28 v40 h40 v-26 h30 v26 h50 v-34 h34 v34 h40 v-18 h40 v40 H0 Z" fill="#2c2466"/>
      <!-- near skyline with a domed church and lit windows -->
      <path d="M0 180 h60 v-34 h44 v34 h20 v-50 h36 v50 h30 v-28 a20 20 0 0 1 40 0 v28 h30 v-56 h40 v56 h36 v-30 h44 v30 h40 v-40 h34 v40 h70 v20 H0 Z" fill="#221c55"/>
      <g fill="#ffd27a" opacity=".85">
        <rect x="72" y="156" width="6" height="7"/><rect x="88" y="156" width="6" height="7"/><rect x="132" y="142" width="6" height="7"/><rect x="146" y="158" width="6" height="7"/>
        <rect x="330" y="140" width="6" height="7"/><rect x="346" y="156" width="6" height="7"/><rect x="420" y="160" width="6" height="7"/><rect x="470" y="150" width="6" height="7"/>
      </g>
      <!-- the Dnipro -->
      <rect x="0" y="198" width="944" height="94" fill="url(#river)"/>
      <g stroke="#6f97e0" stroke-width="3" stroke-linecap="round" opacity=".5">
        <path d="M20 236 h60 M140 252 h80 M260 232 h50 M360 262 h90 M60 276 h70 M480 244 h50"/>
      </g>
      <!-- bridges: deck with a lit top edge and soft arches -->
      <rect x="0" y="186" width="560" height="14" fill="#b9b3e6"/>
      <rect x="0" y="186" width="560" height="4" fill="#e9e6ff"/>
      <path d="M10 200 Q 95 140 180 200 M190 200 Q 275 140 360 200 M370 200 Q 455 140 540 200" fill="none" stroke="#b9b3e6" stroke-width="8" stroke-linecap="round"/>
      <g fill="#8d86c8"><rect x="92" y="200" width="10" height="44" rx="3"/><rect x="272" y="200" width="10" height="44" rx="3"/><rect x="452" y="200" width="10" height="44" rx="3"/></g>
      <!-- incoming missiles with glowing trails -->
      <g stroke="url(#trail)" stroke-width="5" stroke-linecap="round">
        <path d="M330 -10 L 140 170"/><path d="M470 -10 L 290 172"/><path d="M600 -10 L 450 174"/>
      </g>
      <!-- three blasts on the bridges -->
      <circle cx="132" cy="180" r="70" fill="url(#blast)"/>
      <circle cx="282" cy="182" r="62" fill="url(#blast)"/>
      <circle cx="442" cy="182" r="66" fill="url(#blast)"/>
      <g fill="#fff4c2">
        <circle cx="132" cy="180" r="12"/><circle cx="282" cy="182" r="10"/><circle cx="442" cy="182" r="11"/>
      </g>
      <!-- reflections of the blasts in the river -->
      <g fill="#ffb347" opacity=".35">
        <ellipse cx="132" cy="250" rx="36" ry="6"/><ellipse cx="282" cy="256" rx="30" ry="5"/><ellipse cx="442" cy="252" rx="34" ry="6"/>
      </g>
      <rect x="470" width="474" height="292" fill="url(#scrimR)"/>
    </g>
    <text x="22" y="40" class="label">KYIV</text>
    <g class="chip" transform="translate(540,26)"><rect height="34" rx="17" fill="#e8344e"/><text x="16" y="25" class="tag">UKRAINE</text></g>
    <text x="540" y="116" class="lead">Russian missiles</text>
    <text x="540" y="172" class="lead">hit 3 Kyiv bridges</text>
    <text x="540" y="222" class="leadsub">3 killed, about 15 hurt overnight</text>
    <text x="540" y="256" class="leadsub">after Putin vowed revenge</text>
  </g>

  <!-- Markets: red chart crashing on a dark trading screen -->
  <g class="tile" transform="translate(40,476)">
    <rect class="frame" width="463" height="254" rx="18" fill="#141a44"/>
    <g clip-path="url(#clipTile)">
      <rect width="463" height="254" fill="url(#marketsky)"/>
      <g stroke="#2c4778" stroke-width="2" opacity=".7">
        <path d="M250 30 h213 M250 70 h213 M250 110 h213 M250 150 h213"/>
        <path d="M290 0 v170 M340 0 v170 M390 0 v170 M440 0 v170"/>
      </g>
      <g>
        <rect x="270" y="34" width="14" height="40" rx="3" fill="#34d399"/><rect x="276" y="24" width="2" height="60" fill="#34d399"/>
        <rect x="300" y="44" width="14" height="34" rx="3" fill="#ff5c6c"/><rect x="306" y="36" width="2" height="50" fill="#ff5c6c"/>
        <rect x="330" y="60" width="14" height="44" rx="3" fill="#ff5c6c"/><rect x="336" y="52" width="2" height="62" fill="#ff5c6c"/>
        <rect x="360" y="90" width="14" height="38" rx="3" fill="#ff5c6c"/><rect x="366" y="82" width="2" height="54" fill="#ff5c6c"/>
        <rect x="390" y="110" width="14" height="44" rx="3" fill="#ff5c6c"/><rect x="396" y="100" width="2" height="60" fill="#ff5c6c"/>
      </g>
      <polyline points="262,40 300,52 330,80 360,104 392,140 430,160" fill="none" stroke="#ff5c6c" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity=".25"/>
      <polyline points="262,40 300,52 330,80 360,104 392,140 430,160" fill="none" stroke="#ff8a96" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <polygon points="446,172 416,166 438,144" fill="#ff8a96"/>
      <!-- a falling chip -->
      <g transform="translate(410,46) rotate(18)">
        <rect x="-18" y="-18" width="36" height="36" rx="6" fill="#7c86d6"/>
        <rect x="-10" y="-10" width="20" height="20" rx="3" fill="#c4c9ff"/>
        <g stroke="#7c86d6" stroke-width="3"><path d="M-24 -8 h6 M-24 0 h6 M-24 8 h6 M18 -8 h6 M18 0 h6 M18 8 h6"/></g>
      </g>
      <rect width="300" height="254" fill="url(#scrimL)"/>
      <rect y="150" width="463" height="104" fill="url(#caption)"/>
    </g>
    <g class="chip" transform="translate(18,18)"><rect height="32" rx="16" fill="#3b6fd8"/><text x="14" y="23" class="tag">ASIA · MARKETS</text></g>
    <text x="18" y="96" class="head">AI sell-off</text>
    <text x="18" y="140" class="head">sinks Asia</text>
    <text x="18" y="196" class="sub">Nikkei down over 4%, SoftBank −15%,</text>
    <text x="18" y="228" class="sub">as Anthropic's IPO fails to lift tech</text>
  </g>

  <!-- Cyclone: seen from orbit over the Bay of Bengal -->
  <g class="tile" transform="translate(521,476)">
    <rect class="frame" width="463" height="254" rx="18" fill="#0f1236"/>
    <g clip-path="url(#clipTile)">
      <rect width="463" height="254" fill="url(#space)"/>
      <g fill="#fff" opacity=".6"><circle cx="300" cy="20" r="1.2"/><circle cx="430" cy="16" r="1.5"/><circle cx="250" cy="40" r="1"/></g>
      <circle cx="520" cy="560" r="520" fill="url(#planet)"/>
      <!-- India's east coast -->
      <path d="M150 254 C 190 200, 230 180, 270 150 C 290 135, 300 110, 330 96 C 350 86, 370 60, 400 50 L 463 40 L 463 254 Z" fill="#4c9a5b" transform="translate(-60,40)" opacity=".9"/>
      <circle cx="398" cy="88" r="80" fill="url(#softglow)"/>
      <!-- the storm: layered translucent spiral bands -->
      <g transform="translate(398,88) scale(.82)" fill="none" stroke-linecap="round">
        <path d="M0 -14 A 40 40 0 1 1 -54 -40" stroke="#fff" stroke-width="18" opacity=".55"/>
        <path d="M0 14 A 40 40 0 1 1 54 40" stroke="#fff" stroke-width="18" opacity=".55"/>
        <path d="M0 -8 A 26 26 0 1 1 -34 -24" stroke="#fff" stroke-width="12" opacity=".9"/>
        <path d="M0 8 A 26 26 0 1 1 34 24" stroke="#fff" stroke-width="12" opacity=".9"/>
        <circle r="7" fill="#1a2a6a" stroke="none"/>
      </g>
      <rect width="290" height="254" fill="url(#scrimL)"/>
      <rect y="150" width="463" height="104" fill="url(#caption)"/>
    </g>
    <g class="chip" transform="translate(18,18)"><rect height="32" rx="16" fill="#3b6fd8"/><text x="14" y="23" class="tag">INDIA</text></g>
    <text x="18" y="96" class="head">Cyclone Akvan</text>
    <text x="18" y="140" class="head">makes landfall</text>
    <text x="18" y="196" class="sub">Hits the Odisha–Andhra coast near</text>
    <text x="18" y="228" class="sub">Gopalpur; over 300,000 evacuated</text>
  </g>

  <!-- COP31: Earth waiting on a deal, oil struck from the text -->
  <g class="tile" transform="translate(40,748)">
    <rect class="frame" width="463" height="254" rx="18" fill="#122a3a"/>
    <g clip-path="url(#clipTile)">
      <rect width="463" height="254" fill="url(#climatesky)"/>
      <g transform="translate(26,0)">
      <circle cx="372" cy="92" r="90" fill="url(#softglow)" opacity=".6"/>
      <circle cx="372" cy="92" r="58" fill="url(#ocean)"/>
      <path d="M334 64 c 14 -16 38 -14 44 2 c 6 14 -10 22 -4 32 c 6 12 -14 20 -26 12 c -14 -8 -24 -30 -14 -46 Z" fill="#5cc27a"/>
      <path d="M388 48 c 14 -2 26 8 26 20 c 0 10 -10 12 -18 8 c -10 -6 -20 -24 -8 -28 Z M394 104 c 10 -4 20 6 16 16 c -6 8 -20 6 -20 -4 c 0 -6 2 -10 4 -12 Z" fill="#5cc27a"/>
      <path d="M324 84 a 58 58 0 0 0 98 44 a 64 64 0 0 1 -98 -44 Z" fill="#0d2f6a" opacity=".35"/>
      </g>
      <!-- oil drop crossed out -->
      <g transform="translate(350,128) scale(.8)">
        <path d="M0 -40 C 0 -40 -26 -6 -26 10 A 26 26 0 0 0 26 10 C 26 -6 0 -40 0 -40 Z" fill="#1d1d2b"/>
        <path d="M-12 6 a 12 12 0 0 0 8 14" stroke="#6a6a8a" stroke-width="4" fill="none" stroke-linecap="round"/>
        <line x1="-34" y1="34" x2="34" y2="-34" stroke="#ff5c6c" stroke-width="9" stroke-linecap="round"/>
      </g>
      <!-- the clock running out -->
      <g transform="translate(432,30)">
        <circle r="18" fill="#ffcb47"/><circle r="13" fill="#fff6d6"/>
        <path d="M0 0 v-9 M0 0 h7" stroke="#3a2a00" stroke-width="3" stroke-linecap="round"/>
      </g>
      <rect width="290" height="254" fill="url(#scrimL)"/>
      <rect y="150" width="463" height="104" fill="url(#caption)"/>
    </g>
    <g class="chip" transform="translate(18,18)"><rect height="32" rx="16" fill="#1f9d63"/><text x="14" y="23" class="tag">CLIMATE · TÜRKIYE</text></g>
    <text x="18" y="96" class="head">COP31 deadline</text>
    <text x="18" y="140" class="head">day, no deal yet</text>
    <text x="18" y="196" class="sub">Antalya draft drops fossil fuels;</text>
    <text x="18" y="228" class="sub">a deal may slip into the weekend</text>
  </g>

  <!-- Saudi Arabia: missile intercepted above Riyadh at dusk -->
  <g class="tile" transform="translate(521,748)">
    <rect class="frame" width="463" height="254" rx="18" fill="#2a1a4a"/>
    <g clip-path="url(#clipTile)">
      <rect width="463" height="254" fill="url(#desertsky)"/>
      <g fill="#fff" opacity=".6"><circle cx="280" cy="22" r="1.2"/><circle cx="440" cy="60" r="1"/><circle cx="330" cy="70" r="1.3"/></g>
      <!-- skyline: the tall tower with a lit glass face -->
      <path d="M360 170 L 372 40 L 384 24 L 396 40 L 404 170 Z" fill="url(#glass)"/>
      <rect x="300" y="120" width="36" height="50" rx="3" fill="#3a2a6a"/><rect x="420" y="108" width="34" height="62" rx="3" fill="#3a2a6a"/>
      <rect x="252" y="140" width="36" height="30" rx="3" fill="#33255f"/>
      <path d="M200 182 Q 300 150 463 176 V 254 H 200 Z" fill="#7a3f55"/>
      <!-- interceptor arc and the blast high above -->
      <path d="M300 170 Q 310 80 330 52" fill="none" stroke="#bfe3ff" stroke-width="3" stroke-dasharray="7 6" opacity=".9"/>
      <path d="M470 -6 L 350 44" stroke="url(#trail)" stroke-width="4" stroke-linecap="round"/>
      <circle cx="336" cy="48" r="46" fill="url(#blast)"/>
      <circle cx="336" cy="48" r="8" fill="#fff4c2"/>
      <rect width="290" height="254" fill="url(#scrimL)"/>
      <rect y="150" width="463" height="104" fill="url(#caption)"/>
    </g>
    <g class="chip" transform="translate(18,18)"><rect height="32" rx="16" fill="#c27a12"/><text x="14" y="23" class="tag">SAUDI ARABIA</text></g>
    <text x="18" y="96" class="head">Houthi missile</text>
    <text x="18" y="140" class="head">shot down</text>
    <text x="18" y="196" class="sub">Drones also downed; Riyadh confirms</text>
    <text x="18" y="228" class="sub">damage to its tallest tower, PIF HQ</text>
  </g>

  <text x="40" y="1018" class="foot">Reported 20 Nov 2026 · sources: Reuters, AFP, PTI, Saudi Press Agency</text>
</svg>
<script>
  // Size each tag chip to its label.
  for (const chip of document.querySelectorAll('.chip')) {
    const label = chip.querySelector('text');
    chip.querySelector('rect').setAttribute('width', Math.ceil(label.getComputedTextLength()) + 28);
  }
</script>
</body>
</html>
